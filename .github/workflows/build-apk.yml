name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giai nen project.zip neu co
        run: |
          if [ -f project.zip ]; then unzip -o project.zip; fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

            - name: Chap nhan license Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cai dat thu vien
        run: |
          npm install
          npm run prepare-www

      - name: Tao du an Android (Capacitor)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Cau hinh man hinh ngang + toan man hinh
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          grep -q 'screenOrientation' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/java/com/apex/shroudrealms
          cat > android/app/src/main/java/com/apex/shroudrealms/MainActivity.java <<'JAVA'
          package com.apex.shroudrealms;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              hideBars();
            }
            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideBars();
            }
            private void hideBars() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                | View.SYSTEM_UI_FLAG_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
            }
          }
          JAVA

      - name: Dong bo Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shroud-realms-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
